services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rome_test
      POSTGRES_USER: rome_test
      POSTGRES_PASSWORD: secret
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rome_test -d rome_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rome_test
      MYSQL_USER: rome_test
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "rome_test", "--password=secret"]
      interval: 5s
      timeout: 5s
      retries: 12
    command: --default-authentication-plugin=mysql_native_password
